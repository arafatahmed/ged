# Frontal de la GED : TLS, application Angular, reverse proxy vers Django.
server_tokens off;

upstream ged_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/ged.crt;
    ssl_certificate_key /etc/nginx/certs/ged.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Taille maximale d'un envoi ; à aligner sur le paramètre fichiers.taille_max_mo.
    client_max_body_size 100m;

    # --- Django : API, administration technique, sonde, logo ---------------------
    location ~ ^/(api|administration-technique|sante|institution)/ {
        proxy_pass http://ged_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_redirect off;
        include /etc/nginx/snippets/entetes-securite.conf;
        # L'administration technique de Django utilise quelques styles en ligne.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Fichiers statiques de Django (administration technique).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        include /etc/nginx/snippets/entetes-securite.conf;
    }

    # --- Frontend Angular -----------------------------------------------------------
    root /srv/frontend;

    # Fichiers à empreinte (noms changeant à chaque version) : mis en cache longtemps.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/entetes-securite.conf;
    }

    # Toute autre adresse est une route de l'application : index.html, jamais mis en cache,
    # dans lequel Nginx insère le nonce CSP de la réponse.
    location / {
        try_files $uri /index.html;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter "__CSP_NONCE__" $request_id;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/entetes-securite.conf;
        include /etc/nginx/snippets/csp-application.conf;
    }
}
