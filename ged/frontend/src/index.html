<!doctype html>
<html lang="fr" dir="ltr">

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>

    </app-root>
  </body>
</html>
